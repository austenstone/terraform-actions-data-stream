name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Providers move without asking. Catch breaking changes on a Monday, not on a call.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/azure-identity
          - modules/azure-blob
          - modules/azure-kusto
          - modules/fabric-eventhouse
          - modules/aws-s3
          - examples/azure-blob
          - examples/azure-kusto
          - examples/fabric-eventhouse
          - examples/aws-s3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Validate ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  kql-drift:
    # modules/fabric-eventhouse vendors the shared KQL so it stands alone when
    # copied out of the repo. This is the guard against the copies diverging.
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare vendored KQL against modules/azure-kusto/kql
        run: |
          status=0
          for f in analytics enrichment; do
            if ! diff -u "modules/azure-kusto/kql/$f.kql" "modules/fabric-eventhouse/kql/$f.kql"; then
              echo "::error file=modules/fabric-eventhouse/kql/$f.kql::Vendored copy has drifted. Run: cp modules/azure-kusto/kql/$f.kql modules/fabric-eventhouse/kql/$f.kql"
              status=1
            fi
          done
          exit $status

  shellcheck:
    # Not ubuntu-slim: shellcheck is not in the slim image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh modules/*/scripts/*.sh
